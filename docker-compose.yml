services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - server/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Use $$ to escape compose-time interpolation and let the container shell expand it.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-giftlist}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
